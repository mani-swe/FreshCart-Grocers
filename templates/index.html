<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshCart Grocers — Operations & Summariser Hub</title>
    <style>
      :root {
        --bg: #f3f8f4;
        --card: #ffffff;
        --primary: #1f5c3e;
        --primary-dark: #143d29;
        --accent: #40916c;
        --soft-green: #e8f5ee;
        --border: #d8e6dd;
        --text: #1b2e23;
        --muted: #556b5e;
        --error-bg: #fff1f2;
        --error-border: #e11d48;
        --error-text: #9f1239;
      }

      * {
        box-sizing: border-box;
        min-width: 0;
      }

      body {
        margin: 0;
        padding: 32px 16px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      .wrapper {
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(20, 61, 41, 0.06);
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        color: var(--primary);
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .section-label {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .mode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .mode-btn {
        border: 1.5px solid var(--border);
        background: #fafdfb;
        border-radius: 10px;
        padding: 14px 12px;
        text-align: left;
        cursor: pointer;
        transition: all 0.18s ease;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .mode-btn:hover {
        border-color: var(--accent);
        background: var(--soft-green);
      }

      .mode-btn.active {
        border-color: var(--primary);
        background: var(--soft-green);
        box-shadow: 0 0 0 2px rgba(64, 145, 108, 0.22);
      }

      .mode-title {
        display: block;
        font-weight: 700;
        font-size: 14px;
        color: var(--primary-dark);
        margin-bottom: 4px;
      }

      .mode-desc {
        display: block;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .eligible-banner {
        background: var(--soft-green);
        border: 1px solid #b7e4c7;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 18px;
        font-size: 13.5px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .eligible-tags {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .badge {
        background: var(--primary);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
      }

      .upload-zone {
        border: 2px dashed var(--accent);
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        background: #fcfefd;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }

      input[type="file"] {
        font-size: 14px;
        max-width: 100%;
      }

      .submit-btn {
        width: 100%;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 9px;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.18s ease;
      }

      .submit-btn:hover {
        background: var(--primary-dark);
      }

      .output-panel {
        margin-top: 24px;
        display: none;
        border-radius: 10px;
        padding: 18px;
        border: 1px solid var(--border);
        background: #f9fcfa;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .output-panel.error {
        background: var(--error-bg);
        border-color: var(--error-border);
        color: var(--error-text);
      }

      .output-headline {
        margin: 0 0 12px;
        font-size: 17px;
        font-weight: 700;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .meta-box {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .meta-key {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        margin-bottom: 3px;
      }

      code {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      pre {
        background: #18221d;
        color: #eef6f0;
        padding: 14px;
        border-radius: 8px;
        max-width: 100%;
        overflow-x: auto;
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .list-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        font-size: 13px;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .tag-pass {
        color: #1b5e20;
        font-weight: 700;
      }
      .tag-fail {
        color: #b71c1c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>🥬 FreshCart Grocers — Operations & Summariser Hub</h1>
      <p class="subtitle">
        Select an operation first, check eligible file types, upload your store
        file, and inspect the output below.
      </p>

      <div class="section-label">1. Choose Operation</div>
      <div class="mode-grid" id="modeGrid">
        <button type="button" class="mode-btn active" data-mode="validator">
          <span class="mode-title">Input Validator</span>
          <span class="mode-desc"
            >Check if file is valid for summariser prompt</span
          >
        </button>
        <button type="button" class="mode-btn" data-mode="summariser">
          <span class="mode-title">Summary Prompt</span>
          <span class="mode-desc">Generate structured LLM summary prompt</span>
        </button>
        <button type="button" class="mode-btn" data-mode="qc_checklist">
          <span class="mode-title">Quality Control</span>
          <span class="mode-desc"
            >Run produce delivery checklist (QC_01–QC_05)</span
          >
        </button>
        <button type="button" class="mode-btn" data-mode="batch_processing">
          <span class="mode-title">Batch Processing</span>
          <span class="mode-desc">Process order & meeting batches safely</span>
        </button>
      </div>

      <div class="eligible-banner" id="eligibleBanner">
        <div>
          <strong
            >Eligible Files for
            <span id="activeModeName">Input Validator</span>:</strong
          >
        </div>
        <div class="eligible-tags" id="eligibleTags"></div>
        <div id="modeHint" style="margin-top: 8px; color: var(--muted)"></div>
      </div>

      <form id="uploadForm">
        <div class="section-label">2. Upload File</div>
        <div class="upload-zone">
          <input type="file" id="fileInput" name="file" required />
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          Run Input Validator
        </button>
      </form>

      <div class="output-panel" id="outputPanel">
        <h3 class="output-headline" id="outputHeadline"></h3>
        <div id="outputBody"></div>
      </div>
    </div>

    <script>
      const MODES = {
        validator: {
          label: "Input Validator",
          cta: "Run Input Validator",
          formats: [".txt", ".md", ".json", ".csv"],
          accept: ".txt,.md,.json,.csv",
          hint: "Checks file format, non-empty content, minimum length (50+ chars for text), and required JSON/CSV fields before summariser prompt generation.",
        },
        summariser: {
          label: "Summary Prompt",
          cta: "Generate Summary Prompt",
          formats: [".txt", ".md", ".json", ".csv"],
          accept: ".txt,.md,.json,.csv",
          hint: "Validates store transcripts, JSON reports, or CSV logs and builds the FreshCart system persona and structured summary prompt.",
        },
        qc_checklist: {
          label: "Quality Control",
          cta: "Run Quality Checklist",
          formats: [".json"],
          accept: ".json",
          hint: "Expects a JSON inspection object with delivery details and 'responses' for QC_01_CONDITION through QC_05_QUANTITY_WEIGHT.",
        },
        batch_processing: {
          label: "Batch Processing",
          cta: "Run Batch Processor",
          formats: [".json"],
          accept: ".json",
          hint: "Expects a JSON array of order/meeting records; isolates invalid rows and skips duplicate batch_item_id entries without crashing.",
        },
      };

      let selectedMode = "validator";

      const modeButtons = document.querySelectorAll(".mode-btn");
      const activeModeName = document.getElementById("activeModeName");
      const eligibleTags = document.getElementById("eligibleTags");
      const modeHint = document.getElementById("modeHint");
      const fileInput = document.getElementById("fileInput");
      const submitBtn = document.getElementById("submitBtn");
      const uploadForm = document.getElementById("uploadForm");
      const outputPanel = document.getElementById("outputPanel");
      const outputHeadline = document.getElementById("outputHeadline");
      const outputBody = document.getElementById("outputBody");

      function applyMode(modeKey) {
        selectedMode = modeKey;
        const cfg = MODES[modeKey];

        modeButtons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === modeKey);
        });

        activeModeName.textContent = cfg.label;
        submitBtn.textContent = cfg.cta;
        modeHint.textContent = cfg.hint;
        fileInput.setAttribute("accept", cfg.accept);
        fileInput.value = "";

        eligibleTags.innerHTML = cfg.formats
          .map((ext) => `<span class="badge">${ext}</span>`)
          .join("");
      }

      modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => applyMode(btn.dataset.mode));
      });

      function renderMetaBoxes(details) {
        if (!details) return "";
        const entries = Object.entries(details).filter(
          ([, v]) => typeof v !== "object" || v === null,
        );
        return (
          `<div class="meta-grid">` +
          entries
            .map(
              ([k, v]) => `
            <div class="meta-box">
                <span class="meta-key">${escapeHtml(k.replaceAll("_", " "))}</span>
                <strong>${escapeHtml(String(v))}</strong>
            </div>
        `,
            )
            .join("") +
          `</div>`
        );
      }

      function escapeHtml(str) {
        return str
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      uploadForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!fileInput.files.length) return;

        const formData = new FormData();
        formData.append("mode", selectedMode);
        formData.append("file", fileInput.files[0]);

        outputPanel.style.display = "block";
        outputPanel.className = "output-panel";
        outputHeadline.textContent = "Processing...";
        outputBody.innerHTML =
          "<p>Running selected FreshCart check on uploaded file...</p>";

        try {
          const resp = await fetch("/process", {
            method: "POST",
            body: formData,
          });
          const data = await resp.json();

          if (data.status === "error") {
            outputPanel.className = "output-panel error";
            outputHeadline.textContent = "Validation / Processing Error";
            outputBody.innerHTML = `<p>${escapeHtml(data.message || "Unknown error")}</p>`;
            return;
          }

          outputPanel.className = "output-panel";
          outputHeadline.textContent = data.headline || "Completed";

          let html = renderMetaBoxes(data.details);

          if (data.mode === "validator") {
            html += `<div><strong>Validated Content Preview:</strong></div><pre>${escapeHtml(data.preview_text || "")}</pre>`;
          } else if (data.mode === "summariser") {
            if (data.details && data.details.system_prompt) {
              html += `<div><strong>System Prompt:</strong></div><pre>${escapeHtml(data.details.system_prompt)}</pre>`;
            }
            html += `<div><strong>Generated User Prompt:</strong></div><pre>${escapeHtml(data.prompt_text || "")}</pre>`;
          } else if (data.mode === "qc_checklist") {
            const checks = data.checks || [];
            html += `<div><strong>Checklist Breakdown:</strong></div>`;
            html += checks
              .map(
                (c) => `
                    <div class="list-card">
                        <span class="${c.passed ? "tag-pass" : "tag-fail"}">[${c.passed ? "PASS" : "FAIL"}]</span>
                        <strong>${escapeHtml(c.check_id)}</strong> — ${escapeHtml(c.name)}
                        <div style="margin-top:4px; color: var(--muted);">Observed: <code>${escapeHtml(String(c.observed_value))}</code></div>
                        <div style="margin-top:4px;">Action: ${escapeHtml(c.action || "")}</div>
                    </div>
                `,
              )
              .join("");
          } else if (data.mode === "batch_processing") {
            const proc = data.processed_items || [];
            const fail = data.failed_items || [];
            const dup = data.skipped_duplicates || [];

            if (proc.length) {
              html +=
                `<div><strong>Processed Items:</strong></div>` +
                proc
                  .map(
                    (item) => `
                        <div class="list-card"><span class="tag-pass">[PROCESSED]</span> <strong>${escapeHtml(item.batch_item_id)}</strong>: ${escapeHtml(item.summary_line || "")}</div>
                    `,
                  )
                  .join("");
            }
            if (fail.length) {
              html +=
                `<div><strong>Failed Rows:</strong></div>` +
                fail
                  .map(
                    (item) => `
                        <div class="list-card"><span class="tag-fail">[FAILED]</span> <strong>${escapeHtml(item.batch_item_id)}</strong>: ${escapeHtml(item.error || "")}</div>
                    `,
                  )
                  .join("");
            }
            if (dup.length) {
              html +=
                `<div><strong>Skipped Duplicates:</strong></div>` +
                dup
                  .map(
                    (item) => `
                        <div class="list-card"><strong>[DUPLICATE]</strong> <strong>${escapeHtml(item.batch_item_id)}</strong>: ${escapeHtml(item.reason || "")}</div>
                    `,
                  )
                  .join("");
            }
          }

          outputBody.innerHTML = html;
        } catch (err) {
          outputPanel.className = "output-panel error";
          outputHeadline.textContent = "Connection Error";
          outputBody.innerHTML = `<p>Could not reach the Flask server: ${escapeHtml(String(err))}</p>`;
        }
      });

      applyMode("validator");
    </script>
  </body>
</html>
